<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autofficina Felice - Lascia una recensione</title>
    
    <!-- CSS Incorporato per evitare richieste HTTP aggiuntive -->
    <style>
        :root {
            /* Colore primario ispirato ai toni di Google per le recensioni */
            --primary-color: #1a73e8; 
            --primary-hover: #1557b0;
            --bg-color: #f8f9fa;
            --text-main: #202124;
            --text-secondary: #5f6368;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Font di sistema per massima velocità di caricamento e pulizia nativa */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .logo-icon {
            font-size: 56px;
            margin-bottom: 16px;
            display: inline-block;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .btn-review {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            padding: 16px 24px;
            border-radius: 50px; /* Bottone a pillola, ottimo per il tap da mobile */
            width: 100%;
            transition: background-color 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
            gap: 10px;
        }

        .btn-review:hover {
            background-color: var(--primary-hover);
        }

        .btn-review:active {
            transform: scale(0.97);
        }

        /* Stella SVG per il pulsante */
        .star-icon {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Puoi sostituire l'emoji con un tag <img> che punta al logo dell'officina -->
        <div class="logo-icon">🔧</div>
        
        <h1>Autofficina Felice</h1>
        <p>Grazie per averci scelto! La tua opinione è preziosa per aiutarci a mantenere un servizio di alta qualità.</p>
        
        <!-- Il link con il Place ID genererà l'apertura automatica del popup delle recensioni -->
        <a href="https://search.google.com/local/writereview?placeid=ChIJY7bLCBM1ekcRInTCe1Ue48E" class="btn-review" target="_blank" rel="noopener noreferrer">
            <svg class="star-icon" viewBox="0 0 24 24">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>
            Lascia 5 Stelle
        </a>
        
        <div class="footer">
            &copy; 2026 Autofficina Felice
        </div>
    </div>

</body>
</html>
